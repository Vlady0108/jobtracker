<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Tracker preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#EDF0F2;--card:#fff;--ink:#16222E;--muted:#5E6B78;--line:#D3DAE0;--btn:#16222E;--btnink:#fff;
--wishlist:#7B8794;--applied:#2F6FDB;--interview:#C98A00;--offer:#1F8A55;--rejected:#A8556A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11171E;--card:#1A222B;--ink:#E6ECF1;--muted:#93A0AD;--line:#2D3844;--btn:#E6ECF1;--btnink:#11171E;--applied:#5B93F0;--interview:#E0A526;--offer:#3DB57A;--rejected:#CC7A90}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11171E;--card:#1A222B;--ink:#E6ECF1;--muted:#93A0AD;--line:#2D3844;--btn:#E6ECF1;--btnink:#11171E;--applied:#5B93F0;--interview:#E0A526;--offer:#3DB57A;--rejected:#CC7A90}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.tag{font-size:.82rem;color:var(--muted);margin:0 0 18px}
h2{font-size:1rem;font-weight:600;margin:0 0 4px}
form.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;align-self:start}
label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
textarea{resize:vertical;min-height:52px}
:focus-visible{outline:2px solid var(--applied);outline-offset:2px}
button{font:inherit;cursor:pointer}
.primary{background:var(--btn);color:var(--btnink);border:0;border-radius:6px;padding:10px;font-weight:600}
.search{margin-bottom:14px}
.funnel{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:12px;background:var(--line)}
.funnel i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
.chip b{font-weight:600;margin-left:4px;color:var(--muted)}
.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}.chip.on b{color:inherit;opacity:.7}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:8px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.row h3{margin:0;font-size:1.05rem;font-weight:600}
.row p{margin:0;color:var(--muted);font-size:.9rem}
.note{grid-column:1/-1;font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px}
.acts{display:flex;gap:8px;align-items:center}
.acts select{width:auto;padding:5px 8px}
.del{background:none;border:0;color:var(--muted);padding:4px 8px}.del:hover{color:var(--rejected)}
.flag{color:var(--interview);font-weight:600}
a{color:var(--applied)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.i-wishlist{background:var(--wishlist)}.i-applied{background:var(--applied)}.i-interview{background:var(--interview)}.i-offer{background:var(--offer)}.i-rejected{background:var(--rejected)}
.r-wishlist{--c:var(--wishlist)}.r-applied{--c:var(--applied)}.r-interview{--c:var(--interview)}.r-offer{--c:var(--offer)}.r-rejected{--c:var(--rejected)}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Job Tracker</h1>
    <p class="tag">Preview with sample data, saved in this browser only. The real app runs on FastAPI and SQLite.</p>
    <form class="add" id="add">
      <h2>Add an application</h2>
      <label>Company <input name="company" required></label>
      <label>Role <input name="role" required></label>
      <label>Status <select name="status" id="newStatus"></select></label>
      <label>Location <input name="location" placeholder="Remote, Bucharest…"></label>
      <label>Posting link <input name="link" type="url" placeholder="https://"></label>
      <label>Applied on <input name="applied_on" type="date" id="newDate"></label>
      <label>Notes <textarea name="notes"></textarea></label>
      <button class="primary">Add application</button>
    </form>
  </aside>
  <main>
    <input class="search" type="search" id="q" placeholder="Search company or role" aria-label="Search">
    <div id="list"></div>
  </main>
</div>
<script>
const STATUSES=["Wishlist","Applied","Interview","Offer","Rejected"],STALE=14,KEY="jt-preview-apps";
const iso=d=>d.toISOString().slice(0,10),ago=n=>iso(new Date(Date.now()-n*864e5));
const seed=()=>[
 {id:1,company:"Northwind Labs",role:"Backend Engineer (Python)",status:"Interview",location:"Remote, EU",link:"",notes:"Second round with the platform team on Thursday.",applied_on:ago(6)},
 {id:2,company:"Lumen Health",role:"FastAPI Developer",status:"Applied",location:"Bucharest",link:"",notes:"",applied_on:ago(19)},
 {id:3,company:"Kestrel Systems",role:"Data Engineer",status:"Applied",location:"Hybrid",link:"",notes:"",applied_on:ago(3)},
 {id:4,company:"Harbor & Pine",role:"Staff Engineer",status:"Offer",location:"Remote",link:"",notes:"Offer expires in two weeks. Negotiate base salary.",applied_on:ago(31)},
 {id:5,company:"Tessellate",role:"Platform Engineer",status:"Wishlist",location:"Cluj-Napoca",link:"",notes:"",applied_on:ago(1)},
 {id:6,company:"Orbit Freight",role:"Software Engineer",status:"Rejected",location:"Remote",link:"",notes:"",applied_on:ago(24)}];
let apps,filter="",q="";
try{apps=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(apps))apps=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=sel=>STATUSES.map(s=>`<option${s===sel?" selected":""}>${s}</option>`).join("");
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"";
function render(){
  const counts={};STATUSES.forEach(s=>counts[s]=0);apps.forEach(a=>counts[a.status]++);
  const t=q.trim().toLowerCase();
  const rows=apps.filter(a=>(!filter||a.status===filter)&&(!t||(a.company+" "+a.role).toLowerCase().includes(t)))
    .sort((a,b)=>b.applied_on.localeCompare(a.applied_on)||b.id-a.id);
  const today=iso(new Date());
  let h=apps.length?`<div class="funnel" aria-hidden="true">${STATUSES.filter(s=>counts[s]).map(s=>`<i class="i-${s.toLowerCase()}" style="flex:${counts[s]}"></i>`).join("")}</div>`:"";
  h+=`<nav class="chips" aria-label="Filter by status"><button class="chip${filter?"":" on"}" data-f="">All <b>${apps.length}</b></button>`+
    STATUSES.map(s=>`<button class="chip${filter===s?" on":""}" data-f="${s}">${s} <b>${counts[s]}</b></button>`).join("")+`</nav>`;
  h+=rows.map(a=>{
    const d=Math.round((new Date(today)-new Date(a.applied_on))/864e5),u=safeUrl(a.link);
    return `<article class="row r-${a.status.toLowerCase()}"><div><h3>${esc(a.company)}</h3>
      <p>${esc(a.role)}${a.location?" · "+esc(a.location):""}</p>
      <p>${d<=0?"Applied today":"Applied "+d+"d ago"}${a.status==="Applied"&&d>=STALE?'<span class="flag"> · Time to follow up</span>':""}${u?` · <a href="${esc(u)}" target="_blank" rel="noopener">Posting</a>`:""}</p></div>
      <div class="acts"><select data-id="${a.id}" aria-label="Status for ${esc(a.company)}">${opts(a.status)}</select>
      <button class="del" data-del="${a.id}" aria-label="Delete ${esc(a.company)}">Delete</button></div>
      ${a.notes?`<div class="note">${esc(a.notes)}</div>`:""}</article>`}).join("")||
    `<div class="empty">${q||filter?"Nothing matches. Clear the search or pick All.":"No applications yet. Add your first one on the left."}</div>`;
  document.getElementById("list").innerHTML=h;
}
document.getElementById("newStatus").innerHTML=opts("Applied");
document.getElementById("newDate").value=iso(new Date());
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render()});
document.getElementById("list").addEventListener("click",e=>{
  const c=e.target.closest("[data-f]");if(c){filter=c.dataset.f;render();return}
  const x=e.target.closest("[data-del]");if(x){apps=apps.filter(a=>a.id!==+x.dataset.del);save();render()}});
document.getElementById("list").addEventListener("change",e=>{
  const s=e.target.closest("select[data-id]");if(!s)return;
  const a=apps.find(a=>a.id===+s.dataset.id);if(a){a.status=s.value;save();render()}});
document.getElementById("add").addEventListener("submit",e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  apps.push({id:Math.max(0,...apps.map(a=>a.id))+1,company:f.company.trim(),role:f.role.trim(),status:f.status,
    location:f.location.trim(),link:f.link.trim(),notes:f.notes.trim(),applied_on:f.applied_on||iso(new Date())});
  save();filter="";q="";document.getElementById("q").value="";e.target.reset();
  document.getElementById("newDate").value=iso(new Date());render()});
render();
</script>
</body>
</html>
