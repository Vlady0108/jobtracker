<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
:root{--bg:#EDF0F2;--card:#fff;--ink:#16222E;--muted:#5E6B78;--line:#D3DAE0;
--wishlist:#7B8794;--applied:#2F6FDB;--interview:#C98A00;--offer:#1F8A55;--rejected:#A8556A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px;display:grid;grid-template-columns:300px 1fr;gap:32px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 20px}
h2{font-size:1rem;font-weight:600;margin:0 0 12px}
form.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;align-self:start;position:sticky;top:20px}
label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
textarea{resize:vertical;min-height:56px}
:focus-visible{outline:2px solid var(--applied);outline-offset:2px}
button{font:inherit;cursor:pointer}
.primary{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px;font-weight:600}
.search{margin-bottom:14px}
.funnel{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:12px;background:var(--line)}
.funnel i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
.chip b{font-weight:600;margin-left:4px;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.on b{color:#cbd5df}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:8px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.row h3{margin:0;font-size:1.05rem;font-weight:600}
.row p{margin:0;color:var(--muted);font-size:.9rem}
.row .note{grid-column:1/-1;font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px}
.acts{display:flex;gap:8px;align-items:center}
.acts select{width:auto;padding:5px 8px}
.del{background:none;border:0;color:var(--muted);padding:4px 8px}.del:hover{color:var(--rejected)}
.flag{color:var(--interview);font-weight:600}
a{color:var(--applied)}
.empty{padding:32px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.s-wishlist{--c:var(--wishlist);background:var(--wishlist)}.s-applied{--c:var(--applied);background:var(--applied)}
.s-interview{--c:var(--interview);background:var(--interview)}.s-offer{--c:var(--offer);background:var(--offer)}
.s-rejected{--c:var(--rejected);background:var(--rejected)}
.row.s-wishlist,.row.s-applied,.row.s-interview,.row.s-offer,.row.s-rejected{background:var(--card)}
</style>
</head>
<body hx-target="#list">
<div class="wrap">
  <aside>
    <h1>Job Tracker</h1>
    <form class="add" hx-post="/applications" hx-on::after-request="if(event.detail.successful)this.reset()">
      <h2>Add an application</h2>
      <label>Company <input name="company" required></label>
      <label>Role <input name="role" required></label>
      <label>Status
        <select name="status">{% for s in statuses %}<option {{ 'selected' if s=='Applied' }}>{{ s }}</option>{% endfor %}</select>
      </label>
      <label>Location <input name="location" placeholder="Remote, Bucharest…"></label>
      <label>Posting link <input name="link" type="url" placeholder="https://"></label>
      <label>Applied on <input name="applied_on" type="date" value="{{ today.isoformat() }}"></label>
      <label>Notes <textarea name="notes"></textarea></label>
      <button class="primary">Add application</button>
    </form>
  </aside>
  <main>
    <input class="search" type="search" name="q" placeholder="Search company or role"
           hx-get="/applications" hx-trigger="input changed delay:250ms, search" hx-include="[name=filter]">
    <div id="list">{% include "_list.html" %}</div>
  </main>
</div>
</body>
</html>
